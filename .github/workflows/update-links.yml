name: Sync Latest Client Releases & Update Links

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Release Synchronizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_releases.py

      - name: Commit and Push if updated
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing updates..."
            git add README.md index.html releases.json apps/
            git commit -m "chore(releases): auto-sync latest direct download links [skip ci]"
            git push origin main

            echo "Waiting 30s for GitHub Pages before IndexNow ping..."
            sleep 30
            status=$(curl -s -o /tmp/indexnow_resp.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{
                "host": "roozaneh.github.io",
                "key": "113949291c66a76e696870c210f8eee4",
                "keyLocation": "https://roozaneh.github.io/113949291c66a76e696870c210f8eee4.txt",
                "urlList": [
                  "https://roozaneh.github.io/v2ray-clients-download/",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/v2rayng.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/v2rayn.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/streisand.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/v2box.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/happ.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/hiddify.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/nekoray.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/nekobox.html",
                  "https://roozaneh.github.io/v2ray-clients-download/apps/singbox.html"
                ]
              }')
            echo "IndexNow HTTP Status: $status"
          else
            echo "All release links are already up-to-date. No commit needed."
          fi
